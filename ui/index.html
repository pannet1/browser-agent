<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>browser-agent — 4-pane</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0f1115; --panel:#171a21; --border:#242938; --text:#e6e8ee; --muted:#9aa0b2; --accent:#5b8def; --accent2:#22c55e; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { --left-width:240px; --right-width:320px; --bottom-height:64px; display: grid; grid-template-columns: var(--left-width) 6px 1fr 6px var(--right-width); grid-template-rows: 1fr var(--bottom-height); height: 100vh; gap: 0; }
  #app.bottom-hidden { grid-template-rows: 1fr 0; }
  #app.bottom-hidden #bottom { display: none; }
  #app.left-hidden { --left-width:0px; }
  #app.left-hidden #left { visibility:hidden; pointer-events:none; }
  #app.right-hidden { --right-width:0px; }
  #app.right-hidden #right { visibility:hidden; pointer-events:none; }
  .pane { background: var(--panel); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
  #left { border-right: 1px solid var(--border); }
  #center { border: 0; }
  #right { border-left: 1px solid var(--border); }
  #left { grid-column:1; }
  #left-resizer { grid-column:2; }
  #center { grid-column:3; }
  #right-resizer { grid-column:4; }
  #right { grid-column:5; }
  .resizer { background:#10131a; cursor:col-resize; border-left:1px solid var(--border); border-right:1px solid var(--border); }
  .resizer:hover { background:var(--accent); }
  #bottom { grid-column: 1 / -1; border-top: 1px solid var(--border); background: #10131a; padding: 0; display: flex; position:relative; }
  #bottom-resizer { position:absolute; left:0; right:0; top:-3px; height:6px; cursor:row-resize; z-index:2; }
  #bottom-resizer:hover { background:var(--accent); }
  .pane-head { padding: 10px 12px; font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  #skill-search { width:100%; background:#10131a; border:1px solid var(--border); border-radius:6px; color:var(--text); padding:6px 8px; outline:none; font:inherit; text-transform:none; letter-spacing:normal; }
  #skill-search:focus { border-color:var(--accent); }
  .pane-head button { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .pane-head button:hover { color: var(--text); border-color: #2f354d; }
  #skill-list { overflow:auto; padding: 8px; flex:1; }
  .skill { position:relative; padding: 10px 38px 10px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; margin-bottom: 6px; background: #1c2030; }
  .skill.active { border-color: var(--accent); background: #1e2a4a; }
  .skill .name { font-weight: 600; }
  .skill .domain { font-size: 12px; color: var(--muted); }
  .skill-menu-btn { position:absolute; right:6px; top:8px; border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; padding:0 3px; }
  .skill-menu-btn:hover { color:var(--text); }
  .skill-menu { position:absolute; right:6px; top:30px; z-index:3; display:none; min-width:90px; padding:4px; background:#10131a; border:1px solid var(--border); border-radius:6px; box-shadow:0 5px 16px #0008; }
  .skill-menu.open { display:block; }
  .skill-menu button { width:100%; text-align:left; border:0; background:transparent; color:var(--text); padding:5px 7px; border-radius:4px; cursor:pointer; }
  .skill-menu button:hover { background:#242938; }
  #center-body { flex:1; display:flex; align-items:stretch; justify-content:stretch; background: #0b0d12; position: relative; border: 0; overflow:hidden; padding:0; }
  #center-placeholder { color: var(--muted); text-align:center; padding: 24px; }
  #center-placeholder b { color: var(--text); }
  #viewport-img { width: 100%; height: 100%; object-fit: fill; display:none; border: 0; border-radius: 0; cursor: crosshair; outline: none; }
  #viewport-img.active { display:block; flex:1; }
  #activity { flex:1; overflow:auto; padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.6; }
  .log { padding: 6px 8px; border-left: 2px solid #2a3048; margin-bottom: 8px; background: #1a1e2e; border-radius: 6px; }
  .log.thought { border-left-color: var(--accent); }
  .log.action { border-left-color: var(--accent2); }
  .log.correction { border-left-color: #f59e0b; }
  #bottom textarea { flex:1; width:100%; background: transparent; border:0; color: var(--text); padding: 14px 16px; outline: none; resize: none; min-height: 48px; max-height: 160px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
  #bottom textarea::placeholder { color: var(--muted); }
  #toggle-bottom { position: fixed; bottom: 8px; right: 12px; z-index: 9; background: #1c2030; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:999px; cursor:pointer; font-size:12px; }
  #toggle-bottom:hover { color: var(--text); }
  .restore-pane { position:fixed; top:8px; z-index:10; display:none; background:#1c2030; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:999px; cursor:pointer; font-size:12px; }
  #restore-left { left:8px; }
  #restore-right { right:8px; }
  #app.left-hidden ~ #restore-left, #app.right-hidden ~ #restore-right { display:block; }
</style>
</head>
<body>
<div id="app">
  <div id="left" class="pane">
    <div class="pane-head"><input id="skill-search" type="search" placeholder="Search skills…" aria-label="Search skills" /><button id="toggle-left" title="Hide skills">×</button></div>
    <div id="skill-list"></div>
  </div>
  <div id="left-resizer" class="resizer" title="Drag to resize skills"></div>
  <div id="center" class="pane">
    <div class="pane-head"><span>browser-agent — Live CDP Stream</span><span style="font-weight:400; text-transform:none; color:var(--muted); font-size:12px;">no URL bar • HITL interactive</span></div>
    <div id="center-body">
      <div id="center-placeholder">
        <b id="center-title">Select a skill</b>
        <div style="margin-top:6px; color:var(--muted);">CDP canvas — Playwright viewport streams here.<br/>Click/type directly to handle captcha/OTP, agent resumes.</div>
      </div>
      <img id="viewport-img" alt="viewport" tabindex="0" />
    </div>
  </div>
  <div id="right-resizer" class="resizer" title="Drag to resize activity"></div>
  <div id="right" class="pane">
    <div class="pane-head"><span></span><span><button id="clear-logs">clear</button><button id="toggle-right" title="Hide activity">×</button></span></div>
    <div id="activity"></div>
  </div>
  <div id="bottom" class="pane">
    <div id="bottom-resizer" title="Drag to resize terminal"></div>
    <textarea id="prompt" rows="1" placeholder="login to irctc.co.in and book a ticket...  — Enter to send, Ctrl+Enter / Shift+Enter for new line"></textarea>
  </div>
</div>
<button id="toggle-bottom" title="Hide/unhide bottom to reclaim height">↕ bottom</button>
<button id="restore-left" class="restore-pane">← skills</button>
<button id="restore-right" class="restore-pane">activity →</button>
<script>
const skills = [];
let active = null;
let pendingInstruction = null;
let pendingSelection = null;
const listEl = document.getElementById('skill-list');
const centerTitle = document.getElementById('center-title');
const activityEl = document.getElementById('activity');
const skillSearch = document.getElementById('skill-search');
function saveSidebarSkills(){ localStorage.setItem('browser-agent-skills', JSON.stringify(skills)); }
function dragSplitter(el, axis, apply){
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); el.setPointerCapture?.(e.pointerId);
    let last=axis==='x' ? e.clientX : e.clientY;
    const move=ev=>{ const current=axis==='x' ? ev.clientX : ev.clientY; apply(current-last); last=current; };
    const stop=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',stop); };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',stop,{once:true});
  });
}
dragSplitter(document.getElementById('left-resizer'),'x',delta=>{
  const current=parseInt(getComputedStyle(document.getElementById('app')).getPropertyValue('--left-width'))||240;
  document.getElementById('app').style.setProperty('--left-width',`${Math.max(0,Math.min(480,current+delta))}px`);
});
dragSplitter(document.getElementById('right-resizer'),'x',delta=>{
  const current=parseInt(getComputedStyle(document.getElementById('app')).getPropertyValue('--right-width'))||320;
  document.getElementById('app').style.setProperty('--right-width',`${Math.max(0,Math.min(600,current-delta))}px`);
});
dragSplitter(document.getElementById('bottom-resizer'),'y',delta=>{
  const current=parseInt(getComputedStyle(document.getElementById('app')).getPropertyValue('--bottom-height'))||64;
  document.getElementById('app').style.setProperty('--bottom-height',`${Math.max(40,Math.min(260,current-delta))}px`);
});
document.getElementById('toggle-left').onclick=e=>{ e.stopPropagation(); document.getElementById('app').classList.add('left-hidden'); };
document.getElementById('toggle-right').onclick=e=>{ e.stopPropagation(); document.getElementById('app').classList.add('right-hidden'); };
document.getElementById('restore-left').onclick=()=>{ document.getElementById('app').classList.remove('left-hidden'); renderSkills(); };
document.getElementById('restore-right').onclick=()=>{ document.getElementById('app').classList.remove('right-hidden'); renderSkills(); };
document.getElementById('left-resizer').ondblclick=()=>document.getElementById('app').classList.remove('left-hidden');
document.getElementById('right-resizer').ondblclick=()=>document.getElementById('app').classList.remove('right-hidden');
function upsertSkill(skill){
  const normalized={id:skill.id, name:skill.name || skill.skill_name || skill.id, domain:skill.domain || skill.target_domain || ''};
  const key=`${normalized.name.toLowerCase()}|${normalized.domain.toLowerCase()}`;
  const index=skills.findIndex(s=>`${s.name.toLowerCase()}|${s.domain.toLowerCase()}`===key);
  if(index<0){ skills.push(normalized); saveSidebarSkills(); return normalized; }
  const old=skills[index];
  // Router-created durable ids replace the provisional browser-side id while
  // retaining the current selection and one sidebar row.
  if(active===old.id) active=normalized.id;
  skills[index]=normalized;
  saveSidebarSkills();
  return normalized;
}
function renderSkills(){
  listEl.innerHTML = '';
  const query=(skillSearch.value || '').trim().toLowerCase();
  skills.filter(s=>!query || `${s.name} ${s.domain}`.toLowerCase().includes(query)).forEach(s => {
    const d = document.createElement('div');
    d.className = 'skill' + (s.id===active ? ' active' : '');
    d.innerHTML = `<div class=\"name\"></div><div class=\"domain\"></div><button class=\"skill-menu-btn\" aria-label=\"Skill actions\">⋯</button><div class=\"skill-menu\"><button data-action=\"rename\">Rename</button><button data-action=\"delete\">Delete</button></div>`;
    d.querySelector('.name').textContent=s.name;
    d.querySelector('.domain').textContent=s.domain;
    d.onclick = () => { active = s.id; pendingSelection = s.id; renderSkills(); renderCenter(); log(`thought`, `Switched to skill: ${s.name} — restoring storageState…`); connectWS(); };
    const menu=d.querySelector('.skill-menu');
    d.querySelector('.skill-menu-btn').onclick=(e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
    menu.querySelector('[data-action="rename"]').onclick=async(e)=>{
      e.stopPropagation();
      const name=prompt('Rename skill', s.name);
      if(!name || name.trim()===s.name) return;
      const res=await fetch(`/api/skills/${encodeURIComponent(s.id)}/rename`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name.trim()})});
      if(res.ok){ s.name=name.trim(); renderSkills(); renderCenter(); log('action', `Renamed skill to ${s.name}`); }
    };
    menu.querySelector('[data-action="delete"]').onclick=async(e)=>{
      e.stopPropagation();
      if(!confirm(`Delete skill “${s.name}”?`)) return;
      const res=await fetch(`/api/skills/${encodeURIComponent(s.id)}`, {method:'DELETE'});
      if(res.ok){ const i=skills.indexOf(s); if(i>=0) skills.splice(i,1); saveSidebarSkills(); if(active===s.id) active=skills[0]?.id||null; renderSkills(); renderCenter(); log('action', `Deleted skill: ${s.name}`); }
    };
    listEl.appendChild(d);
  });
}
skillSearch.addEventListener('input', renderSkills);
function renderCenter(){
  const s = skills.find(x=>x.id===active);
  centerTitle.textContent = s ? `${s.name} — ${s.domain}` : 'Select a skill';
}
function log(kind, text){
  const e = document.createElement('div');
  e.className = 'log ' + kind;
  e.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  activityEl.appendChild(e);
  activityEl.scrollTop = activityEl.scrollHeight;
  try{ fetch('/api/client-log', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({state: kind.toUpperCase(), thought: text, kind})}); }catch{}
}
document.getElementById('clear-logs').onclick = () => activityEl.innerHTML='';
const promptEl = document.getElementById('prompt');
let ws = null;
function flushPending(){
  if(pendingInstruction && ws && ws.readyState===1){
    ws.send(JSON.stringify({ instruction: pendingInstruction }));
    log('thought', `Dispatched queued: ${pendingInstruction}`);
    pendingInstruction = null;
  }
}
const viewportImg = document.getElementById('viewport-img');
const centerPlaceholder = document.getElementById('center-placeholder');
function showFrame(b64){
  if(!b64) return;
  viewportImg.src = 'data:image/png;base64,' + b64;
  viewportImg.classList.add('active');
  centerPlaceholder.style.display='none';
}
viewportImg.onclick = (e)=>{
  viewportImg.focus();
  const rect = viewportImg.getBoundingClientRect();
  const scaleX = viewportImg.naturalWidth / rect.width;
  const scaleY = viewportImg.naturalHeight / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  if(ws && ws.readyState===1) ws.send(JSON.stringify({ type:'input', action:'click', skill_id: active, target_domain: skills.find(s=>s.id===active)?.domain||'', x, y }));
  log('action', `HITL click ${Math.round(x)},${Math.round(y)}`);
};
function sendViewportInput(message, description){
  if(ws && ws.readyState===1){
    ws.send(JSON.stringify({ ...message, skill_id: active, target_domain: skills.find(s=>s.id===active)?.domain||'' }));
    log('action', description);
  }
}
function forwardViewportKey(e){
  // Browser shortcuts should remain local except for keys intended for the
  // remote page. Text input is sent as text; navigation/editing keys preserve
  // Playwright's native key semantics.
  if(!viewportImg.classList.contains('active')) return;
  if(e.target === promptEl || e.target.matches?.('input, textarea, [contenteditable="true"]')) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  if(e.key.length === 1){
    sendViewportInput({type:'input', action:'type', text:e.key}, 'HITL type');
  } else {
    sendViewportInput({type:'input', action:'key', key:e.key}, `HITL key ${e.key}`);
  }
}
function forwardViewportPaste(e){
  if(!viewportImg.classList.contains('active')) return;
  if(e.target === promptEl || e.target.matches?.('input, textarea, [contenteditable="true"]')) return;
  const text=e.clipboardData?.getData('text') || '';
  if(!text) return;
  e.preventDefault();
  sendViewportInput({type:'input', action:'type', text}, `HITL paste ${text.length} chars`);
}
// The screenshot is an <img>, and Firefox does not consistently preserve its
// focus while its src is replaced with each streamed frame. Capture keys at
// document level instead; a click in the pane still sets the remote page's
// focus through Playwright.
document.addEventListener('keydown', forwardViewportKey);
document.addEventListener('paste', forwardViewportPaste);
viewportImg.addEventListener('wheel', (e)=>{
  if(!viewportImg.classList.contains('active')) return;
  e.preventDefault();
  const rect=viewportImg.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(viewportImg.naturalWidth/rect.width);
  const y=(e.clientY-rect.top)*(viewportImg.naturalHeight/rect.height);
  sendViewportInput(
    {type:'input', action:'scroll', delta_y:e.deltaY, x, y},
    `HITL scroll ${Math.round(e.deltaY)}`,
  );
}, {passive:false});
function connectWS(){
  if(!active) return;
  if(ws) try{ ws.close(); }catch{}
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${active}`);
  ws.onmessage = (ev) => {
    try{
      const m=JSON.parse(ev.data);
      if(m.frame && m.frame.b64){
        showFrame(m.frame.b64);
        return;
      }
      if(m.b64){
        showFrame(m.b64);
        return;
      }
      if(m.skill && m.skill.skill_id){
        const routedId=m.skill.skill_id;
        const routedDomain=m.skill.target_domain || skills.find(s=>s.id===active)?.domain || '';
        if(!skills.find(s=>s.id===routedId)){
          upsertSkill({id:routedId, name:m.skill.skill_name || routedId, domain:routedDomain});
        }
        active=routedId;
        renderSkills();
        renderCenter();
      }
      log(m.state==='RUNNING'?'action': m.state==='PAUSED'?'correction':'thought', m.thought||m.frame||ev.data);
      if(m.blocker) log('correction', `blocker: ${m.blocker.type} - ${m.blocker.reason}`);
    } catch{ log('thought', ev.data); }
  };
  ws.onopen = () => {
    log('thought', `WS connected → ${active}`);
    if(pendingSelection===active){ ws.send(JSON.stringify({type:'select_skill', skill_id:active, target_domain:skills.find(s=>s.id===active)?.domain||''})); pendingSelection=null; }
    flushPending();
  };
  const currentWs = ws;
  currentWs.onclose = () => {
    if (ws !== currentWs) return;
    log('correction', `WS closed`);
  };
  currentWs.onerror = () => log('correction', `WS error → ${active}`);
}
function submitPrompt(){
  const v = promptEl.value.trim();
  if(!v) return;
  log('action', `Instruction: ${v}`);
  const m = v.toLowerCase().match(/([a-z0-9.-]+\.[a-z]{2,})/);
  let newSkill = false;
  if(m && !skills.find(s=> s.domain.includes(m[1]) || s.name.toLowerCase().includes(m[1].split('.')[0]))){
    const name = `login ${m[1].split('.')[0]}`;
    const id = name.replace(/[^a-z0-9]+/g,'-');
    upsertSkill({ id, name, domain: m[1] });
    active = id; renderSkills(); renderCenter(); log('thought', `Skill Dispatcher: created new skill '${name}'`);
    newSkill = true;
    pendingInstruction = v;
    connectWS();
  } else if(v.toLowerCase().includes('hacker') && !skills.find(s=> s.id.includes('hacker'))){
    const id = 'hacker-news'; const name='hacker news'; const domain='news.ycombinator.com';
    upsertSkill({ id, name, domain }); active=id; renderSkills(); renderCenter();
    log('thought', `Skill Dispatcher: created new skill '${name}'`);
    newSkill = true;
    pendingInstruction = v;
    connectWS();
  }
  if(!newSkill){
    if(ws && ws.readyState===1) ws.send(JSON.stringify({ instruction: v }));
    else { pendingInstruction = v; if(!ws || ws.readyState!==1) connectWS(); else flushPending(); log('thought', `Queuing until WS ready…`); }
  }
  promptEl.value='';
  promptEl.style.height='48px';
}
promptEl.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.ctrlKey && !e.shiftKey){ e.preventDefault(); submitPrompt(); }
});
promptEl.addEventListener('input', ()=>{ promptEl.style.height='auto'; promptEl.style.height=Math.min(promptEl.scrollHeight,160)+'px'; });
document.getElementById('toggle-bottom').onclick = () => {
  document.getElementById('app').classList.toggle('bottom-hidden');
  log('thought', document.getElementById('app').classList.contains('bottom-hidden') ? 'Bottom hidden — height reclaimed' : 'Bottom shown');
};
try{
  const saved=JSON.parse(localStorage.getItem('browser-agent-skills') || '[]');
  if(Array.isArray(saved)) saved.forEach(upsertSkill);
}catch{}
renderSkills(); renderCenter();
log('thought', 'IDLE — waiting for instruction');
log('thought', 'EventBus ready — 4 panes rendered');
fetch('/api/skills').then(r=>r.json()).then(items=>{
  (items||[]).forEach(upsertSkill);
  renderSkills();
  renderCenter();
}).catch(()=>{});
connectWS();
fetch('/api/health').then(r=>r.json()).then(j=> log('thought', `API health: ${j.status}`)).catch(()=>{});
</script>
</body>
</html>
