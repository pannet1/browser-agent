<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>browser-agent — 4-pane</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0f1115; --panel:#171a21; --border:#242938; --text:#e6e8ee; --muted:#9aa0b2; --accent:#5b8def; --accent2:#22c55e; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 240px 1fr 320px; grid-template-rows: 1fr auto; height: 100vh; gap: 0; }
  #app.bottom-hidden { grid-template-rows: 1fr 0; }
  #app.bottom-hidden #bottom { display: none; }
  .pane { background: var(--panel); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
  #left { border-right: 1px solid var(--border); }
  #center { border-left: 0; border-right: 0; }
  #right { border-left: 1px solid var(--border); }
  #bottom { grid-column: 1 / -1; border-top: 1px solid var(--border); background: #10131a; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
  .pane-head { padding: 10px 12px; font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .pane-head button { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .pane-head button:hover { color: var(--text); border-color: #2f354d; }
  #skill-list { overflow:auto; padding: 8px; flex:1; }
  .skill { padding: 10px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; margin-bottom: 6px; background: #1c2030; }
  .skill.active { border-color: var(--accent); background: #1e2a4a; }
  .skill .name { font-weight: 600; }
  .skill .domain { font-size: 12px; color: var(--muted); }
  #center-body { flex:1; display:flex; align-items:center; justify-content:center; background: #0b0d12; position: relative; border-top: 1px solid var(--border); }
  #center-body canvas { width: 90%; height: 90%; border: 1px dashed #2a3048; border-radius: 12px; background: #0f1220; display:flex; }
  #center-placeholder { color: var(--muted); text-align:center; padding: 24px; }
  #center-placeholder b { color: var(--text); }
  #activity { flex:1; overflow:auto; padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.6; }
  .log { padding: 6px 8px; border-left: 2px solid #2a3048; margin-bottom: 8px; background: #1a1e2e; border-radius: 6px; }
  .log.thought { border-left-color: var(--accent); }
  .log.action { border-left-color: var(--accent2); }
  .log.correction { border-left-color: #f59e0b; }
  #bottom input { flex:1; background: #171a21; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; outline: none; }
  #bottom input:focus { border-color: var(--accent); }
  #bottom button { background: var(--accent); color: white; border:0; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  #bottom button:hover { filter: brightness(1.1); }
  #toggle-bottom { position: fixed; bottom: 8px; right: 12px; z-index: 9; background: #1c2030; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:999px; cursor:pointer; font-size:12px; }
  #toggle-bottom:hover { color: var(--text); }
</style>
</head>
<body>
<div id="app">
  <div id="left" class="pane">
    <div class="pane-head"><span>Skills</span><button id="new-skill">+ new</button></div>
    <div id="skill-list"></div>
  </div>
  <div id="center" class="pane">
    <div class="pane-head"><span>Center — Live CDP Stream</span><span style="font-weight:400; text-transform:none; color:var(--muted); font-size:12px;">no URL bar • HITL interactive</span></div>
    <div id="center-body">
      <div id="center-placeholder">
        <b id="center-title">Select a skill</b>
        <div style="margin-top:6px; color:var(--muted);">CDP canvas — Playwright viewport streams here.<br/>Click/type directly to handle captcha/OTP, agent resumes.</div>
      </div>
    </div>
  </div>
  <div id="right" class="pane">
    <div class="pane-head"><span>Activity / Thought / Correction</span><button id="clear-logs">clear</button></div>
    <div id="activity"></div>
  </div>
  <div id="bottom" class="pane">
    <input id="prompt" placeholder="login to irctc.co.in and book a ticket..." />
    <button id="send">Send</button>
  </div>
</div>
<button id="toggle-bottom" title="Hide/unhide bottom to reclaim height">↕ bottom</button>
<script>
const skills = [
  { id: "login-irctc", name: "login irctc", domain: "irctc.co.in" },
  { id: "gmail-inbox", name: "gmail inbox", domain: "mail.google.com" },
];
let active = skills[0].id;
const listEl = document.getElementById('skill-list');
const centerTitle = document.getElementById('center-title');
const activityEl = document.getElementById('activity');
function renderSkills(){
  listEl.innerHTML = '';
  skills.forEach(s => {
    const d = document.createElement('div');
    d.className = 'skill' + (s.id===active ? ' active' : '');
    d.innerHTML = `<div class=\"name\">${s.name}</div><div class=\"domain\">${s.domain}</div>`;
    d.onclick = () => { active = s.id; renderSkills(); renderCenter(); log(`thought`, `Switched to skill: ${s.name} — restoring storageState…`); connectWS(); };
    listEl.appendChild(d);
  });
}
function renderCenter(){
  const s = skills.find(x=>x.id===active);
  centerTitle.textContent = s ? `${s.name} — ${s.domain}` : 'Select a skill';
}
function log(kind, text){
  const e = document.createElement('div');
  e.className = 'log ' + kind;
  e.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  activityEl.appendChild(e);
  activityEl.scrollTop = activityEl.scrollHeight;
}
document.getElementById('clear-logs').onclick = () => activityEl.innerHTML='';
document.getElementById('new-skill').onclick = () => {
  const name = prompt('New skill name (e.g. login irctc)');
  if(!name) return;
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  skills.push({ id, name, domain: 'new' });
  active = id; renderSkills(); renderCenter(); log('action', `Created skill: ${name}`);
};
const promptEl = document.getElementById('prompt');
const sendEl = document.getElementById('send');
let ws = null;
function connectWS(){
  if(ws) try{ ws.close(); }catch{}
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${active}`);
  ws.onmessage = (ev) => { try{ const m=JSON.parse(ev.data); log(m.state==='RUNNING'?'action':'thought', m.thought||ev.data); }catch{ log('thought', ev.data); } };
  ws.onopen = () => log('thought', `WS connected → ${active}`);
  ws.onclose = () => log('correction', `WS closed`);
}
sendEl.onclick = () => {
  const v = promptEl.value.trim();
  if(!v) return;
  log('action', `Instruction: ${v}`);
  // auto-create skill if domain-like
  const m = v.toLowerCase().match(/([a-z0-9.-]+\.[a-z]{2,})/);
  let target = skills.find(s=> active===s.id);
  if(m && !skills.find(s=> s.domain.includes(m[1]) || s.name.toLowerCase().includes(m[1].split('.')[0]))){
    const name = `login ${m[1].split('.')[0]}`;
    const id = name.replace(/[^a-z0-9]+/g,'-');
    skills.push({ id, name, domain: m[1] });
    active = id; renderSkills(); renderCenter(); log('thought', `Skill Dispatcher: created new skill '${name}'`);
    connectWS();
  }
  if(ws && ws.readyState===1) ws.send(JSON.stringify({ instruction: v }));
  else log('correction', 'WS not ready — will dispatch on reconnect');
  promptEl.value='';
};
promptEl.addEventListener('keydown', e=>{ if(e.key==='Enter') sendEl.click(); });
document.getElementById('toggle-bottom').onclick = () => {
  document.getElementById('app').classList.toggle('bottom-hidden');
  log('thought', document.getElementById('app').classList.contains('bottom-hidden') ? 'Bottom hidden — height reclaimed' : 'Bottom shown');
};
renderSkills(); renderCenter();
log('thought', 'IDLE — waiting for instruction');
log('thought', 'EventBus ready — 4 panes rendered');
connectWS();
fetch('/api/health').then(r=>r.json()).then(j=> log('thought', `API health: ${j.status}`)).catch(()=>{});
</script>
</body>
</html>
